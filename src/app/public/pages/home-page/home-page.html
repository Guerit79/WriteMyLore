<main class="home-page">
  <!-- Compte (mode démonstration) : en haut à droite, le bouton d'administration reste en bas à gauche. -->
  <app-account-menu />

  @if (!isBookOpen()) {
    <app-grimoire-cover (openBook)="openGrimoire()" />
  }

  @if (isBookOpen()) {
  <app-grimoire-book [chapter]="chapitre()" />
}

  <!-- Accès discret à l'administration (non sécurisé, pas d'authentification pour l'instant) -->
  <a class="admin-access" routerLink="/admin" aria-label="Accéder à l’administration" title="Administration">
    <span aria-hidden="true">✒&#xFE0E;</span>
  </a>
</main>
