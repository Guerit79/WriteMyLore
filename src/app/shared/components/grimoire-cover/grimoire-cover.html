<div
  class="grimoire-cover"
  [class.opening]="isOpening"
  role="button"
  tabindex="0"
  aria-label="Ouvrir le grimoire Write My Lore"
  (click)="open()"
  (keydown.enter)="open()"
  (keydown.space)="$event.preventDefault(); open()"
>

  <div class="cover-content">

    <h1 class="cover-title">
      WRITE MY<br>
      LORE
    </h1>

    <p class="cover-subtitle">
      ENCYCLOPÉDIE FANTAISIE PAR FCCLEM
    </p>

    <p class="cover-hint">
      — Cliquer pour ouvrir —
    </p>

  </div>

</div>
